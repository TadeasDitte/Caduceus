events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;

    # Vite serves JS/CSS straight from its own container in development, so
    # everything here is either PHP or a file already sitting in public/.
    server {
        listen 8000;
        server_name localhost;

        root /var/www/public;
        index index.php index.html;

        client_max_body_size 64m;

        # Xdebug breakpoints stop the worker; don't let Nginx give up on it.
        fastcgi_read_timeout 600s;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass php-fpm:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            # Session and XSRF cookies push response headers past the 4k/8k
            # default, which fails the request with a 502.
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_busy_buffers_size 64k;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
